program: sfl.py

method: grid

parameters:
  attack:
    values: [badnet, DBA, neurotoxin]

  attack_mode:
    values: [baseline, replacement]

  data:
    value: cifar10

  num_agents:
    value: 20

  num_corrupt:
    value: 4

  target_class:
    value: 7

  poison_frac:
    value: 0.5

  multiple_servers:
    value: false

  seed:
    values: [0, 43, 44]

  aggr:
    values: [avg, mkrum, alignins, foolsgold, mmetric, feddlad]

  aggr_server:
    values: [avg, mkrum, alignins, foolsgold, mmetric, feddlad]
